name: V3 Release Byte Bridge

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/v3-release-byte-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  big-assets:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: dual-000
            asset: dual_summary_000.parquet
          - key: dual-001
            asset: dual_summary_001.parquet
          - key: specialist-000
            asset: specialist_000.parquet
          - key: specialist-001
            asset: specialist_001.parquet
          - key: specialist-002
            asset: specialist_002.parquet
          - key: temporal-000
            asset: temporal_000.parquet
          - key: temporal-001
            asset: temporal_001.parquet
          - key: temporal-002
            asset: temporal_002.parquet
    steps:
      - name: Download exact release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p payload
          gh release download v3-discovery --repo "${{ github.repository }}" --dir payload --pattern "${{ matrix.asset }}"

      - name: Upload exact bytes as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: v3-${{ matrix.key }}
          path: payload/${{ matrix.asset }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  small-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Download remaining exact release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p payload
          assets=(
            bundle_manifest.json
            candidate_summary.parquet
            chronological_diagnostics.parquet
            coverage.parquet
            crossfit_diagnostics.parquet
            data_dictionary.md
            edge_families.parquet
            edge_registry.parquet
            EVIDENCE_COMPLETE.json
            exhaustiveness_manifest.json
            feature_registry.parquet
            horizon_ladder.parquet
            manifest.json
            regime_breakdown.parquet
            resolution_comparison.parquet
            single_summary.parquet
            source_manifest.json
            specialist_summary.parquet
            STATUS.json
            tail_ladder.parquet
            target_registry.parquet
            time_of_day.parquet
            trial_ledger.parquet
            variant_summary.parquet
          )
          for f in "${assets[@]}"; do
            gh release download v3-discovery --repo "${{ github.repository }}" --dir payload --pattern "$f"
          done

      - name: Upload exact bytes as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: v3-small-assets
          path: payload/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
