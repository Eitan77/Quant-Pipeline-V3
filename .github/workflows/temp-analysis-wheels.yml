name: Temporary Analysis Wheels

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/temp-analysis-wheels.yml"

permissions:
  contents: read

jobs:
  wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          mkdir wheels
          python -m pip download --only-binary=:all: --dest wheels duckdb==1.4.1 pyarrow==21.0.0
      - uses: actions/upload-artifact@v4
        with:
          name: analysis-wheels
          path: wheels/
          compression-level: 0
          retention-days: 1
